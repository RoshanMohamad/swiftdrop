worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  # Proof-of-delivery photos are limited to 2 MB by the API; leave headroom for the form.
  client_max_body_size 3m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Container DNS: resolve upstreams at request time so nginx starts before the services do.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/swiftdrop/routes.inc;
  }

  # Optional TLS server, added by 40-tls.sh when ENABLE_TLS=true.
  include /etc/nginx/conf.d/*.conf;
}
