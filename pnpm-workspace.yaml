packages:
  - apps/*
  - packages/*
overrides:
  decode-uri-component: 0.5.1
allowBuilds:
  '@prisma/engines': true
  prisma: true
  bcrypt: true
  esbuild: true
  '@parcel/watcher': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - jose@6.2.14
  - nodemailer@10.3.1
